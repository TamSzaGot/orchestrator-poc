apiVersion: v1
kind: Service
metadata:
  name: orchestrator-read
spec:
  selector:
    app: orchestrator
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-write
spec:
  selector:
    app: orchestrator
    leader: "true"
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
