apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-bff
  template:
    metadata:
      labels:
        app: admin-bff
    spec:
      containers:
        - name: admin-bff
          image: admin-bff:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ORCHESTRATOR_READ_BASE_URL
              value: http://orchestrator-read
            - name: ORCHESTRATOR_WRITE_BASE_URL
              value: http://orchestrator-write
---
apiVersion: v1
kind: Service
metadata:
  name: admin-bff
spec:
  selector:
    app: admin-bff
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
